[project]
name = "vendor-quote-extractor"
version = "0.1.0"
description = "AI-powered document processor for vendor quote extraction"
requires-python = ">=3.11"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
filterwarnings = [
    "ignore::DeprecationWarning",
]
markers = [
    "integration: marks tests as integration tests (require real API calls)",
]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]
ignore = []

[tool.ruff.lint.isort]
known-first-party = ["src", "config"]

[tool.ruff.lint.per-file-ignores]
"src/ui/app.py" = ["E402"]

[tool.pyright]
include = ["src", "config"]
exclude = ["tests"]
pythonVersion = "3.11"
typeCheckingMode = "basic"
venvPath = "."
venv = ".venv"
